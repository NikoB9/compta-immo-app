name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: PostgreSQL migration and access checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: compta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Apply database migration
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: compta_test
          PGUSER: postgres
          PGPASSWORD: ${{ github.run_id }}
        run: for migration in infra/postgres/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done

      - name: Check row access policies
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: compta_test
          PGUSER: postgres
          PGPASSWORD: ${{ github.run_id }}
        run: psql -v ON_ERROR_STOP=1 -f infra/postgres/tests/rls_smoke.sql

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test domain rules
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
